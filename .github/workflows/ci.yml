name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Smoke-test CLI
        run: |
          aws-iam-least-priv --version
          aws-iam-least-priv analyze --role app-runtime \
            --from-file examples/cloudtrail.json \
            --current examples/current-policy.json --out /tmp/policy.json
          python -c "import json,sys; p=json.load(open('/tmp/policy.json')); assert p['Version']=='2012-10-17'; assert len(p['Statement'])==2"
