name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Smoke-test CLI
        run: |
          aws-iam-least-priv --version
          aws-iam-least-priv analyze --role app-runtime \
            --from-file examples/cloudtrail.json \
            --current examples/current-policy.json --out /tmp/policy.json
          python -c "import json,sys; p=json.load(open('/tmp/policy.json')); assert p['Version']=='2012-10-17'; assert len(p['Statement'])==2"
